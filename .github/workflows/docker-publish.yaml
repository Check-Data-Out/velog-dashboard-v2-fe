name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Install dependencies
        run: |
          npm install -g pnpm@10.33.0
          pnpm install --frozen-lockfile

      # .env.production 변경 시 `pnpm sync-env` 를 실행하면 이 구간이 자동 업데이트됩니다.
      - name: Create .env.production file
        run: |
          # BEGIN_ENV_SYNC
          echo "NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}" >> .env.production
          echo "NEXT_PUBLIC_CLIENT_BASE_URL=${{ secrets.NEXT_PUBLIC_CLIENT_BASE_URL }}" >> .env.production
          echo "NEXT_PUBLIC_CHANNELTALK_PLUGIN_KEY=${{ secrets.NEXT_PUBLIC_CHANNELTALK_PLUGIN_KEY }}" >> .env.production
          echo "NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}" >> .env.production
          echo "NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}" >> .env.production
          # END_ENV_SYNC

      # 토큰이 없으면 Sentry 플러그인이 조용히 업로드·release 생성을 건너뛰므로 빌드 전에 실패시킨다
      - name: Check Sentry auth token secret
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          test -n "$SENTRY_AUTH_TOKEN" || { echo "::error::SENTRY_AUTH_TOKEN secret missing"; exit 1; }

      # 소스맵 업로드 토큰은 빌드 step 의 env 로만 주입한다 (.env.production 과 이미지에는 넣지 않는다)
      - name: Build Next.js application
        run: |
          pnpm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Docker 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker 이미지 빌드
      - name: Build Docker Image
        run: |
          docker build -t velog-dashboard-v2-fe:latest .

      # Docker Hub에 푸시
      - name: Push Docker Image
        run: |
          docker tag velog-dashboard-v2-fe:latest ${{ secrets.DOCKER_USERNAME }}/velog-dashboard-v2-fe:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/velog-dashboard-v2-fe:latest
